name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          # Check the oldest supported LTS line in package.json's engines.node.
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      # Reports (never fails on) changes to the book format, template API and MCP shapes; see tests/compat/README.md.
      - name: Report compatibility surface changes
        run: npm run compat:report

  changes:
    # Pull requests that only touch files no desktop smoke script reads (the site, decision records, benchmarks)
    # skip the macOS job. Pushes to main always run it.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-changes.mjs

  desktop:
    needs: changes
    # Keep private-repository PRs from consuming macOS minutes.
    if: needs.changes.outputs.desktop == 'true' && (github.event.repository.private == false || github.event_name == 'push')
    runs-on: macos-latest
    # The focused smoke suite takes eight to ten minutes on a hosted Mac since smoke-proof joined it (its stalled-picture
    # case alone waits a minute); leave room so a passing run isn't cancelled.
    timeout-minutes: 15
    env:
      IMAGEFLOW_HIDE_WINDOW: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
      - name: Check Apple silicon runner
        run: node -e "if (process.arch !== 'arm64') throw new Error('Desktop CI requires an arm64 runner')"
      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: |
            .build/electron-cache
            ~/Library/Caches/electron
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Install PDF test tools
        run: brew install poppler
      - run: npm run test:desktop:smoke -- --visible
