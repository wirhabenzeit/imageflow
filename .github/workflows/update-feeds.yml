name: Update feeds

on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-feeds.yml'
      - 'scripts/generate-update-feeds.mjs'
      - 'src/update-feed.ts'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate feeds from all published releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/generate-update-feeds.mjs .build/update-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .build/update-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish channel feeds
        id: deployment
        uses: actions/deploy-pages@v4
