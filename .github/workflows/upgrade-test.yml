name: Signed upgrade test

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: signed-upgrade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upgrade:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 60
    # Reuse existing signing secrets and approval without broadening the tag-only
    # release policy. Manual reruns use an existing trusted version tag.
    environment: release
    env:
      IMAGEFLOW_HIDE_WINDOW: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
      - name: Require tested code on main before credential access
        run: node scripts/release-main.mjs
      - name: Require Apple silicon
        run: node -e "if (process.arch !== 'arm64') throw new Error('Upgrade tests require Apple silicon')"
      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: |
            .build/electron-cache
            ~/Library/Caches/electron
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run build
      - name: Prepare isolated versions
        run: node scripts/upgrade-fixtures.mjs prepare
      - name: Package four versions without signing credentials
        run: node scripts/upgrade-fixtures.mjs build
      - name: Sign fixtures with temporary credentials
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: node scripts/mac-credentials.mjs sign-fixtures
      - name: Create and trust a one-day loopback TLS certificate
        # Seconds normally; fail fast if macOS ever waits for a confirmation nobody can give.
        timeout-minutes: 3
        run: node scripts/upgrade-fixtures.mjs trust
      - name: Exercise real downloads, installation, relaunch and MCP reconnection
        run: node scripts/test-signed-upgrade.mjs
      - name: Remove local server trust
        if: always()
        run: node scripts/upgrade-fixtures.mjs untrust
      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: signed-upgrade-report
          path: .build/upgrade-test/signed-upgrade-report.json
          if-no-files-found: warn
          retention-days: 14
