name: Packaged app

# Builds the Mac app and runs the packaged smoke tests (the ones the Release workflow repeats after signing) on every
# commit that reaches main. Pull requests don't wait for this: it takes about fifteen minutes. A red run names the
# merge that broke the release path, and the Release workflow refuses a tag whose commit has no passing run
# (scripts/release-packaged.mjs). It can also be started from Actions, for example to rerun a flaky failure.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per commit, never cancelled: a cancelled run would leave that commit without a verdict.
  group: packaged-${{ github.sha }}
  cancel-in-progress: false

jobs:
  packaged:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      IMAGEFLOW_HIDE_WINDOW: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
      - name: Check Apple silicon runner
        run: node -e "if (process.arch !== 'arm64') throw new Error('Packaged tests require an arm64 runner')"
      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: |
            .build/electron-cache
            ~/Library/Caches/electron
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Install PDF test tools
        run: brew install poppler
      - name: Build the app without release credentials and test it
        run: npm run test:packaged
