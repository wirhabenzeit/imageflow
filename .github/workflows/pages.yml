name: Pages

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: read

# Serialize the whole production build/deployment, including release-triggered
# feed refreshes. PR builds never deploy and have their own concurrency group.
concurrency:
  group: github-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  # GitHub Pages accepted deployments made from a release's tag context but kept serving the previous site
  # (v1.0.0-beta.3: both release-triggered deployments reported success; the feed stayed empty until main deployed
  # again). A release event therefore starts this workflow on main instead of deploying from the tag.
  release-refresh:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Rebuild the site and update feeds from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      feeds: ${{ steps.feeds.outputs.feeds }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci --ignore-scripts
      # The docs and updater MRs may merge in either order. Once both are on
      # main, every deployment builds both components into this single artifact.
      - name: Install documentation dependencies
        if: hashFiles('site/package.json') != ''
        run: npm ci
        working-directory: site
      - name: Build documentation and check links
        if: hashFiles('site/package.json') != ''
        run: npm run build
        working-directory: site
      - name: Assemble Pages site
        run: |
          mkdir -p .build/pages
          if [ -f site/package.json ]; then
            cp -a site/.vitepress/dist/. .build/pages/
          fi
          touch .build/pages/.nojekyll
      - name: Generate update feeds alongside documentation
        if: hashFiles('scripts/generate-update-feeds.mjs') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/generate-update-feeds.mjs .build/pages
      - name: Record the versions the feeds announce
        id: feeds
        run: |
          version() { node -e 'const f=process.argv[1]; try { console.log(require(f).release?.version ?? "none") } catch { console.log("missing") }' "$PWD/.build/pages/updates/$1/darwin-arm64/RELEASES.json"; }
          echo "feeds=beta:$(version beta) stable:$(version stable)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: .build/pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish documentation and update feeds together
        id: deployment
        uses: actions/deploy-pages@v4

  # A deployment can report success without going live, so check what visitors and installed apps actually get.
  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: The live update feeds match this build
        env:
          EXPECTED: ${{ needs.build.outputs.feeds }}
        run: |
          base='https://wirhabenzeit.github.io/imageflow/updates'
          live() { curl -fsS "$base/$1/darwin-arm64/RELEASES.json?run=$GITHUB_RUN_ID-$RANDOM" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).release?.version ?? "none"))'; }
          # The Pages CDN caches for up to ten minutes.
          for attempt in $(seq 1 26); do
            actual="beta:$(live beta || echo error) stable:$(live stable || echo error)"
            [ "$actual" = "$EXPECTED" ] && { echo "Live feeds: $actual"; exit 0; }
            sleep 30
          done
          echo "::error::Live feeds show '$actual', this build announces '$EXPECTED'."
          exit 1
